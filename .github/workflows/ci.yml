name: CI
on:
  push:
    branches:
      - do-droplet-image
  pull_request:

jobs:
  build-alpine:
    name: Build DO Droplet image
    runs-on: ubuntu-latest
    permissions:
      # Needed by the publish step to create/update the rolling release.
      contents: write
    steps:
      - uses: actions/checkout@v6

      # We must run this outside the chroot.
      - run: sudo modprobe nbd max_part=16

      - name: Set up Alpine Linux v3.22
        uses: jirutka/setup-alpine@v1
        with:
          # XXX: v3.23 doesn't work here, running package triggers results in "unshare: Invalid argument"
          branch: v3.22

      - name: Build DigitalOcean Droplet image
        run: |
          ./alpine-make-vm-image \
              --image-format qcow2 \
              --image-size 2G \
              --partition \
              --serial-console \
              --repositories-file do-droplet/repositories \
              --packages "$(cat do-droplet/packages)" \
              --fs-skel-dir do-droplet/rootfs \
              --fs-skel-chown root:root \
              --script-chroot \
              alpine-do.qcow2 -- ./do-droplet/configure.sh
        shell: alpine.sh --root {0}

      - name: Verify DigitalOcean image requirements
        run: |
          set -eu
          # blkid: busybox's applet does not support -o/-s, so use util-linux's.
          apk add --no-progress qemu-img e2fsprogs-extra blkid
          modprobe nbd max_part=16 2>/dev/null || true
          qemu-nbd --connect=/dev/nbd0 alpine-do.qcow2
          trap 'umount /mnt 2>/dev/null; qemu-nbd --disconnect /dev/nbd0' EXIT
          # Give the kernel a moment to scan the GPT.
          for _ in $(seq 30); do [ -e /dev/nbd0p1 ] && break; sleep 1; done
          mount /dev/nbd0p1 /mnt

          echo '--- runlevel entries in the image ---'
          find /mnt/etc/runlevels -mindepth 2 | sort
          echo '-------------------------------------'

          fail=0
          # Runlevel entries are symlinks whose targets are absolute paths into the
          # image, so they dangle when read from outside it. Test the link itself
          # with -L; do not use ls or -e, which follow the link and report missing.
          check() { if eval "$2"; then echo "ok: $1"; else echo "FAIL: $1"; fail=1; fi; }

          check 'ConfigDrive precedes NoCloud in datasource_list' \
              'grep -qE "^datasource_list:.*ConfigDrive" /mnt/etc/cloud/cloud.cfg.d/01-datasource.cfg'
          check 'cloud-init services registered by setup-cloud-init' \
              'find /mnt/etc/runlevels -name "cloud-init-local" | grep -q .'
          check 'sshd enabled at boot' \
              '[ -L /mnt/etc/runlevels/default/sshd ]'
          check 'dhcpcd daemon NOT enabled at boot' \
              '! [ -L /mnt/etc/runlevels/default/dhcpcd ]'
          check 'timezone set to UTC' \
              '[ -e /mnt/etc/localtime ]'
          check 'sshd_config has UsePAM yes' \
              'grep -q "^UsePAM yes" /mnt/etc/ssh/sshd_config'
          check 'no baked-in SSH host keys' \
              '! ls /mnt/etc/ssh/ssh_host_* >/dev/null 2>&1'
          check 'machine-id is empty' \
              '! [ -s /mnt/etc/machine-id ]'
          check 'root filesystem is ext4' \
              'blkid -o value -s TYPE /dev/nbd0p1 | grep -qx ext4'

          # The image is installed by the HOST's apk, so the database on disk is
          # written in the host apk-tools' format. If the image itself pulls a
          # different apk-tools major version, every apk command on the booted
          # Droplet dies with "file format is invalid or inconsistent". Same
          # arch, so we can just run the image's own apk against its own db.
          echo "host apk:  $(apk --version)"
          echo "image apk: $(chroot /mnt /sbin/apk --version 2>&1 || true)"
          check 'image apk can read its own database' \
              'chroot /mnt /sbin/apk info -e busybox >/dev/null 2>&1'

          exit $fail
        shell: alpine.sh --root {0}

      # The image is built by root inside the chroot; make it readable by the
      # runner user so the compress and upload steps can touch it.
      #
      # DigitalOcean accepts a custom image compressed with gzip or bzip2 and
      # decompresses it on import, so we ship the bz2 and never the raw qcow2.
      - name: Compress the image
        run: |
          set -eu
          sudo chown "$(id -u):$(id -g)" alpine-do.qcow2
          echo "IMAGE_NAME=alpine-do-$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          bzip2 -9 alpine-do.qcow2
          ls -l alpine-do.qcow2.bz2

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: alpine-do.qcow2.bz2
          if-no-files-found: error
          retention-days: 30
          # Already bzip2'd; re-deflating it in the artifact zip only burns time.
          compression-level: 0

      # Workflow artifacts need an authenticated API call to download, so
      # DigitalOcean cannot import from one. A release asset is public and,
      # unlike the artifact, is a plain file rather than a zip wrapper.
      #
      # This is a ROLLING release: the tag is reused so the download URL is
      # stable and can be pasted into DO once and left alone. The tradeoff is
      # that there is no history -- each build replaces the previous image.
      #
      # Only publishes for pushes to the branch, never for pull requests, which
      # would otherwise let a PR overwrite the published image.
      - name: Publish rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: image-latest
        run: |
          set -eu
          # Name the asset with the build date so a downloaded file is
          # identifiable, and publish a stable copy under a fixed name.
          cp alpine-do.qcow2.bz2 "${IMAGE_NAME}.qcow2.bz2"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "Automated build from ${GITHUB_SHA}."
          else
            gh release create "$TAG" \
                --title 'Latest DO Droplet image' \
                --notes "Automated build from ${GITHUB_SHA}." \
                --prerelease
          fi

          # --clobber replaces the assets from the previous build.
          gh release upload "$TAG" \
              alpine-do.qcow2.bz2 "${IMAGE_NAME}.qcow2.bz2" --clobber

          echo "Stable import URL:"
          echo "  https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/alpine-do.qcow2.bz2"

      # Hand the release URL to DigitalOcean so the image is ready to use
      # without a manual import. Runs after the release step because DO fetches
      # the URL server-side, so the asset must already be published.
      #
      # NOTE: the API cannot replace the contents of an existing custom image --
      # PUT /v2/images/{id} only edits name/description/distribution. "Keep one
      # image, same name" is therefore implemented as create-new, wait for it to
      # import, then delete the older images that share the name. Creating first
      # and deleting last means a failed import leaves the previous image intact.
      - name: Upload image to DigitalOcean
        if: github.event_name == 'push'
        env:
          DO_TOKEN: ${{ secrets.DO_IMG_UPLOAD_PAT }}
          DO_REGION: ${{ vars.DO_IMG_UPLOAD_REGION }}
          DO_IMAGE_NAME: alpine-do-droplet-latest
          TAG: image-latest
        run: |
          set -eu

          if [ -z "${DO_TOKEN:-}" ]; then
            echo "::error::secret DO_IMG_UPLOAD_PAT is not set" >&2; exit 1
          fi
          if [ -z "${DO_REGION:-}" ]; then
            echo "::error::repository variable DO_IMG_UPLOAD_REGION is not set" >&2; exit 1
          fi

          # Branch explicitly rather than interpolating an optional -d argument:
          # an unquoted ${3:+-d "$3"} would word-split a JSON body containing
          # spaces across several curl arguments.
          api() {  # api <method> <path> [json-body]
            if [ $# -ge 3 ]; then
              curl -sS -X "$1" \
                  -H 'Content-Type: application/json' \
                  -H "Authorization: Bearer ${DO_TOKEN}" \
                  -d "$3" \
                  "https://api.digitalocean.com/v2$2"
            else
              curl -sS -X "$1" \
                  -H 'Content-Type: application/json' \
                  -H "Authorization: Bearer ${DO_TOKEN}" \
                  "https://api.digitalocean.com/v2$2"
            fi
          }

          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/alpine-do.qcow2.bz2"
          body=$(jq -nc \
              --arg name "$DO_IMAGE_NAME" \
              --arg url "$url" \
              --arg region "$DO_REGION" \
              --arg desc "Alpine DO Droplet image, built from ${GITHUB_SHA}" \
              '{name: $name, url: $url, region: $region, distribution: "Unknown",
                description: $desc, tags: ["alpine", "docker", "ci-built"]}')

          echo "Creating custom image in ${DO_REGION} from ${url}"
          created=$(api POST /images "$body")
          image_id=$(echo "$created" | jq -r '.image.id // empty')
          if [ -z "$image_id" ]; then
            echo "::error::image create failed" >&2
            echo "$created" >&2
            exit 1
          fi
          echo "Created image id ${image_id}; waiting for import to finish"

          # Import is asynchronous. Poll until the status settles; without this a
          # green build would say nothing about whether DO accepted the image.
          # status is one of NEW, available, pending, deleted, retired.
          status=
          for _ in $(seq 60); do        # 60 x 15s = 15 minutes
            img=$(api GET "/images/${image_id}")
            status=$(echo "$img" | jq -r '.image.status // "unknown"')
            case "$status" in
              available)
                echo "Image ${image_id} is available"
                break
                ;;
              NEW|pending)
                echo "  status=${status}, still importing..."
                sleep 15
                ;;
              *)
                echo "::error::import ended with status=${status}" >&2
                echo "$img" | jq -r '.image.error_message // "no error_message"' >&2
                exit 1
                ;;
            esac
          done

          if [ "$status" != available ]; then
            echo "::error::timed out after 15m waiting for import (status=${status})" >&2
            exit 1
          fi

          # Only now remove older images with the same name, so a failed import
          # never leaves you with nothing usable.
          old_ids=$(api GET '/images?private=true&per_page=200' \
              | jq -r --arg n "$DO_IMAGE_NAME" --argjson keep "$image_id" \
                  '.images[] | select(.name == $n and .id != $keep) | .id')
          for old in $old_ids; do
            echo "Deleting superseded image ${old}"
            api DELETE "/images/${old}" >/dev/null
          done

          echo "DigitalOcean image '${DO_IMAGE_NAME}' (id ${image_id}) ready in ${DO_REGION}"
