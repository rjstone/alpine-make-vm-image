name: CI
on:
  push:
    branches:
      - do-droplet-image
  pull_request:

jobs:
  build-alpine:
    name: Build DO Droplet image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # We must run this outside the chroot.
      - run: sudo modprobe nbd max_part=16

      - name: Set up Alpine Linux v3.22
        uses: jirutka/setup-alpine@v1
        with:
          # XXX: v3.23 doesn't work here, running package triggers results in "unshare: Invalid argument"
          branch: v3.22

      - name: Build DigitalOcean Droplet image
        run: |
          ./alpine-make-vm-image \
              --image-format qcow2 \
              --image-size 2G \
              --partition \
              --serial-console \
              --repositories-file do-droplet/repositories \
              --packages "$(cat do-droplet/packages)" \
              --fs-skel-dir do-droplet/rootfs \
              --fs-skel-chown root:root \
              --script-chroot \
              alpine-do-$(date +%Y-%m-%d).qcow2 -- ./do-droplet/configure.sh
        shell: alpine.sh --root {0}

      - name: Verify DigitalOcean image requirements
        run: |
          set -eu
          # blkid: busybox's applet does not support -o/-s, so use util-linux's.
          apk add --no-progress qemu-img e2fsprogs-extra blkid
          modprobe nbd max_part=16 2>/dev/null || true
          qemu-nbd --connect=/dev/nbd0 alpine-do-$(date +%Y-%m-%d).qcow2
          trap 'umount /mnt 2>/dev/null; qemu-nbd --disconnect /dev/nbd0' EXIT
          # Give the kernel a moment to scan the GPT.
          for _ in $(seq 30); do [ -e /dev/nbd0p1 ] && break; sleep 1; done
          mount /dev/nbd0p1 /mnt

          echo '--- runlevel entries in the image ---'
          find /mnt/etc/runlevels -mindepth 2 | sort
          echo '-------------------------------------'

          fail=0
          # Runlevel entries are symlinks whose targets are absolute paths into the
          # image, so they dangle when read from outside it. Test the link itself
          # with -L; do not use ls or -e, which follow the link and report missing.
          check() { if eval "$2"; then echo "ok: $1"; else echo "FAIL: $1"; fail=1; fi; }

          check 'ConfigDrive precedes NoCloud in datasource_list' \
              'grep -qE "^datasource_list:.*ConfigDrive" /mnt/etc/cloud/cloud.cfg.d/01-datasource.cfg'
          check 'cloud-init services registered by setup-cloud-init' \
              'find /mnt/etc/runlevels -name "cloud-init-local" | grep -q .'
          check 'sshd enabled at boot' \
              '[ -L /mnt/etc/runlevels/default/sshd ]'
          check 'dhcpcd daemon NOT enabled at boot' \
              '! [ -L /mnt/etc/runlevels/default/dhcpcd ]'
          check 'timezone set to UTC' \
              '[ -e /mnt/etc/localtime ]'
          check 'sshd_config has UsePAM yes' \
              'grep -q "^UsePAM yes" /mnt/etc/ssh/sshd_config'
          check 'no baked-in SSH host keys' \
              '! ls /mnt/etc/ssh/ssh_host_* >/dev/null 2>&1'
          check 'machine-id is empty' \
              '! [ -s /mnt/etc/machine-id ]'
          check 'root filesystem is ext4' \
              'blkid -o value -s TYPE /dev/nbd0p1 | grep -qx ext4'

          exit $fail
        shell: alpine.sh --root {0}
