# Put the Droplet's SSH keys (chosen in the DigitalOcean control panel or API)
# on root, as DigitalOcean's own images do. sshd_config already limits root to
# key-based logins (PermitRootLogin prohibit-password).
#
# cloud-init's default, disable_root: true, would instead give the keys to its
# default "alpine" user (which has passwordless doas) and leave root only a
# "Please login as alpine" stub. cloud-init still copies the keys to alpine,
# but alpine is for the local console only: sshd and PAM refuse it over SSH.
# See /etc/ssh/sshd_config.d/20-deny-alpine.conf, /etc/pam.d/sshd and
# /etc/pam.d/login.
disable_root: false
