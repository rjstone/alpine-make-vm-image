# Drop weak MACs from OpenSSH's default list rather than replacing the list,
# so algorithms added by future releases are still offered:
#  - hmac-sha1*: SHA-1 based (hmac-sha1, hmac-sha1-etm@openssh.com).
#  - umac-64*: a 64-bit tag (umac-64@openssh.com, umac-64-etm@openssh.com).
# Included before the main sshd_config, and the first value read wins.
MACs -hmac-sha1*,umac-64*
