# alpine, cloud-init's default user, has passwordless doas and logs in without
# a password on the local console (see /etc/pam.d/login). It must never be
# reachable over SSH, so it is refused by several independent layers; undoing
# one alone does not open it:
#   1. DenyUsers, below.
#   2. No public-key authentication and no authorized_keys file for alpine,
#      below. cloud-init still writes the Droplet's keys to
#      ~alpine/.ssh/authorized_keys; sshd does not read them. Password and
#      keyboard-interactive authentication are off for everyone in sshd_config.
#   3. The PAM account stack in /etc/pam.d/sshd.
DenyUsers alpine

# A Match block in an Include'd file ends at the end of that file, so this
# cannot capture settings in the main sshd_config. CI checks the effective
# config for both alpine and root with sshd -T -C.
Match User alpine
	PubkeyAuthentication no
	AuthorizedKeysFile none
